server:
  port: 8084

spring:
  application:
    name: discodeit
  boot:
    admin:
      client:
        url: http://localhost:9090
  config:
    activate:
      on-profile: dev
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    show-sql: false  # org.hibernate.SQL 로거와 중복 출력되므로 끔
    properties:
      hibernate:
        format_sql: true         # SQL 줄바꿈 포맷팅
        highlight_sql: true      # SQL 색깔 강조
        use_sql_comments: true   # SQL에 생성 출처 주석 추가 (예: /* insert for User */)
  datasource:
    url: jdbc:h2:mem:discodeit
    driver-class-name: org.h2.Driver
    username: discodeit_user
    password: discodeit1234
  h2:
    console:
      enabled: true # H2 콘솔 웹 페이지 사용 여부
      path: /h2-console # 컨설 접속 경로 (기본값)
logging:
  level:
    com.sprint.mission.discodeit: debug
    org.hibernate.SQL: debug                # 실행되는 SQL 쿼리 로그
    org.hibernate.orm.jdbc.bind: trace      # 바인딩 파라미터 값 로그 (Hibernate 6+, trace에서만 값 출력)

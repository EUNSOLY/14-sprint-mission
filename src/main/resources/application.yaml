spring:
  application:
    name: 14-sprint-mission
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: true
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        globally_quoted_identifiers: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:54322/discodeit?useSSL=false
    username: discodeit_user
    password: discodeit1234

server:
  port: 8080

discodeit:
  repository:
    type: jcf # jcf | file
    file-directory: .discodeit

file:
  path: .uploader
spring:
  application:
    name: 14-sprint-mission
  profiles:
    default: dev
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true
    properties:
      hibernate:
        globally_quoted_identifiers: true                          # 테이블·컬럼명을 전부 큰따옴표로 감쌈 (예약어 충돌 방지)
        globally_quoted_identifiers_skip_column_definitions: true  # columnDefinition(타입 지정)은 따옴표에서 제외
        format_sql: true                                           # SQL 줄바꿈 포맷팅
        highlight_sql: true                                        # SQL 색깔 강조
        use_sql_comments: true                                     # SQL에 생성 출처 주석 추가 (예: /* insert for User */)
    defer-datasource-initialization: true                          # Hibernate DDL 실행 후에 schema.sql/data.sql 실행
  sql:
    init:
      mode: NEVER
      schema-locations:
        - 'classpath:schema.sql'

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - loggers


logging:
  level:
    root: info
    org.hibernate.SQL: DEBUG                                        # 실행되는 SQL 쿼리 로그
    org.hibernate.orm.jdbc.bind: DEBUG                              # 바인딩 파라미터 값 로그 (Hibernate 6+)
    org.springframework.jdbc.datasource.init: DEBUG                 # schema.sql 같은 SQL 스크립트 실행 로그
discodeit:
  repository:
    type: jcf # jcf | file
    file-directory: .discodeit
  storage:
    type: "local"
    local:
      root-path: ".discodeit-files/upload"
      #      root-path: "/Users/eunsol/CodeitDevelop/upload/"


file:
  path: .uploader
spring:
  application:
    name: discodeit
  boot:
    admin:
      client:
        instance:
          name: discodeit
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        globally_quoted_identifiers: true                          # 테이블·컬럼명을 전부 큰따옴표로 감쌈 (예약어 충돌 방지)
        globally_quoted_identifiers_skip_column_definitions: true  # columnDefinition(타입 지정)은 따옴표에서 제외
    defer-datasource-initialization: true                          # Hibernate DDL 실행 후에 schema.sql/data.sql 실행
  sql:
    init:
      mode: NEVER
      schema-locations:
        - 'classpath:schema.sql'
info:
  app:
    name: ${spring.application.name}
    version: 1.7.0
    java:
      version: 17
    spring-boot:
      version: 3.4.0
    config:
      dataSource: ${spring.datasource}
      jpa: ${spring.jpa.hibernate.ddl-auto}
      storage:
        type: ${discodeit.storage.type}
        path: ${discodeit.storage.local.root-path}
      multipart:
        max-file-size: ${spring.servlet.multipart.max-file-size}
        max-request-size: ${spring.servlet.multipart.max-request-size}

management:
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - loggers

logging:
  level:
    root: info

discodeit:
  repository:
    type: jcf # jcf | file
    file-directory: .discodeit
  storage:
    type: ${STORAGE_TYPE:local}  # local | s3 (기본값: local)
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}
    s3:
      access-key: ${AWS_S3_ACCESS_KEY:}
      secret-key: ${AWS_S3_SECRET_KEY:}
      region: ${AWS_S3_REGION:}
      bucket: ${AWS_S3_BUCKET:}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600} # (기본값: 10분)

file:
  path: .uploader